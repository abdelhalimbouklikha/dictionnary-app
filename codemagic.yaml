workflows:
  ios-unsigned:
    name: Build IPA for Sideloadly
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      groups:
        - lexifr_config

    scripts:
      - name: Prepare project
        script: |
          set -e
          git lfs pull
          brew install xcodegen
          export APPLE_TEAM_ID=""
          python3 Tools/verify_dictionary.py \
            --database Database/french.sqlite \
            --minimum-entries 100000
          xcodegen generate

      - name: Build app
        script: |
          xcodebuild \
            -project LexiFR.xcodeproj \
            -scheme LexiFR \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Make IPA
        script: |
          mkdir -p build/ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/LexiFR.app build/ipa/Payload/
          cd build/ipa
          zip -qry LexiFR.ipa Payload

    artifacts:
      - build/ipa/LexiFR.ipa