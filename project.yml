name: LexiFR
options:
  minimumXcodeGenVersion: 2.41.0
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    SWIFT_STRICT_CONCURRENCY: targeted
    OTHER_LDFLAGS: "$(inherited) -lsqlite3"
targets:
  LexiFR:
    type: application
    platform: iOS
    sources:
      - path: LexiFR
        excludes:
          - Resources
      - path: LexiFR/Resources
        buildPhase: resources
      - path: Database
        buildPhase: resources
        excludes:
          - README.md
          - "*.stats.json"
          - "*.gz"
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${LEXIFR_BUNDLE_ID}"
        PRODUCT_NAME: LexiFR
        INFOPLIST_KEY_CFBundleDisplayName: LexiFR
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LexiFRTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LexiFRTests
    dependencies:
      - target: LexiFR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${LEXIFR_BUNDLE_ID}.tests"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LexiFR.app/LexiFR"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LexiFRUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LexiFRUITests
    dependencies:
      - target: LexiFR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${LEXIFR_BUNDLE_ID}.uitests"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LexiFR
schemes:
  LexiFR:
    build:
      targets:
        LexiFR: all
        LexiFRTests: [test]
        LexiFRUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: LexiFRTests
        - name: LexiFRUITests
    run:
      config: Debug
    archive:
      config: Release
